backend:
  name: git-gateway
  branch: main

media_folder: "shelby-site/public/images"
public_folder: "/images"

locale: ru

# Формат файлов - JSON
extension: json
format: json

collections:
  # ── НАСТРОЙКИ САЙТА ──
  - name: "settings"
    label: "⚙️ Настройки сайта"
    files:
      - name: "general"
        label: "Общие настройки"
        file: "shelby-site/public/data/settings.json"
        format: json
        fields:
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Часы работы", name: "hours", widget: "string" }
          - { label: "Заголовок Hero", name: "hero_title", widget: "string" }
          - { label: "Описание Hero", name: "hero_desc", widget: "text" }

  # ── АКЦИИ И БАННЕРЫ ──
  - name: "banners"
    label: "🎯 Акции и баннеры"
    files:
      - name: "promo"
        label: "Акции на главной"
        file: "shelby-site/public/data/banners.json"
        format: json
        fields:
          - label: "Акции"
            name: "items"
            widget: "list"
            fields:
              - { label: "Заголовок акции", name: "title", widget: "string" }
              - { label: "Описание", name: "desc", widget: "string" }
              - { label: "Текст кнопки", name: "btn", widget: "string", default: "Подробнее" }
              - label: "Цвет метки"
                name: "color"
                widget: "select"
                options:
                  - { label: "Золотой", value: "gold" }
                  - { label: "Красный (Срочно)", value: "red" }
                  - { label: "Зелёный (Новинка)", value: "green" }
              - { label: "Активна", name: "active", widget: "boolean", default: true }

  # ── ТОВАРЫ ──
  - name: "products"
    label: "📦 Товары"
    folder: "shelby-site/public/data/products"
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{price}} ₸"
    fields:
      - { label: "Название", name: "name", widget: "string" }

      - label: "Тип генератора"
        name: "type"
        widget: "select"
        options:
          - { label: "Бензиновый", value: "benzin" }
          - { label: "Дизельный", value: "dizel" }
          - { label: "Газовый", value: "gaz" }
          - { label: "Инверторный", value: "invertor" }
          - { label: "Промышленный", value: "prom" }

      - { label: "Порядок сортировки (1 = первый)", name: "sort_order", widget: "number", default: 99, value_type: "int" }

      - label: "Наличие"
        name: "stock"
        widget: "select"
        default: "in_stock"
        options:
          - { label: "✅ В наличии", value: "in_stock" }
          - { label: "🕐 Под заказ", value: "on_order" }
          - { label: "❌ Нет в наличии", value: "out_of_stock" }

      - { label: "Фото товара", name: "image", widget: "image", required: false }
      - { label: "Подзаголовок (мощность, особенности)", name: "subtitle", widget: "string" }
      - { label: "Цена (₸)", name: "price", widget: "string" }
      - { label: "Старая цена (необязательно)", name: "old_price", widget: "string", required: false }

      - label: "Метка"
        name: "tag"
        widget: "select"
        required: false
        options:
          - { label: "Нет", value: "" }
          - { label: "🆕 New", value: "new" }
          - { label: "🔥 Хит продаж", value: "hit" }
          - { label: "💰 Акция", value: "sale" }

      - { label: "Мощность", name: "power", widget: "string" }
      - { label: "Топливо", name: "fuel", widget: "string" }
      - { label: "Объём бака", name: "tank", widget: "string" }
      - { label: "Время работы", name: "runtime", widget: "string" }
      - { label: "Вес", name: "weight", widget: "string" }
      - { label: "Уровень шума", name: "noise", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }

      - label: "Похожие товары"
        name: "related"
        widget: "list"
        required: false
        field: { label: "Название товара", name: "name", widget: "string" }

      - { label: "Активен", name: "active", widget: "boolean", default: true }
